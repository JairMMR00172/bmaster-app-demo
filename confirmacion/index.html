<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Tech Master | Correo Confirmado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0d0e;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #16181b;
      border: 1px solid #2a2d34;
      border-radius: 16px;
      padding: 40px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(200, 160, 80, 0.15);
      color: #d4af37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: #ffffff;
      text-transform: uppercase;
    }
    p {
      color: #9ca3af;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #0c0d0e;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>¡Correo Confirmado!</h1>
    <p>Tu cuenta en <strong>Prop Tech Master</strong> ha sido validada con éxito. Ya puedes volver a la aplicación e iniciar sesión.</p>
    <a href="bmaster://" class="btn">Abrir la aplicación</a>
  </div>
</body>
</html>
